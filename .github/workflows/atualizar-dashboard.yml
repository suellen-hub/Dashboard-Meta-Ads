name: Atualizar dashboard Meta Ads

on:
  schedule:
    - cron: "13 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install cryptography
      - name: Buscar dados e montar o dashboard
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          DASH_SENHA: ${{ secrets.DASH_SENHA }}
        run: python scripts/atualizar.py
      - name: Publicar
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Atualiza dados do dashboard Meta Ads"
          git push
