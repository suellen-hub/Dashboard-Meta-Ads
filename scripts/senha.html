<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meta Ads · Connectabil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#150F29;--green:#07C86F;--purple:#610DAB}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--navy);color:#fff;font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:16px}
form{width:min(100%,380px);background:#1E1838;border:1px solid #332B55;border-radius:14px;padding:32px 28px}
h1{font:800 26px/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 6px}
h1 b{color:var(--green)}
p{color:#B7B0CF;margin:0 0 22px;font-size:15px}
label{display:block;font-size:13px;color:#B7B0CF;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid #3E3566;background:#120D24;color:#fff}
input:focus{outline:3px solid var(--green);outline-offset:1px}
button{margin-top:14px;width:100%;font:600 15px "Instrument Sans",sans-serif;padding:12px;border:0;border-radius:8px;background:var(--green);color:var(--navy);cursor:pointer}
button:disabled{opacity:.6}
.err{min-height:20px;margin-top:10px;color:#FF8A8A;font-size:14px}
</style>
</head>
<body>
<form id="f">
<h1>Meta Ads · <b>Connectabil</b></h1>
<p>Dashboard de campanhas · uso interno. Digite a senha para abrir.</p>
<label for="pw">Senha</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<button id="bt" type="submit">Abrir dashboard</button>
<div class="err" id="err" role="alert"></div>
</form>
<script>
var S="%SALT%",V="%IV%",C="%CT%",N=%ITER%;
function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(V)},k,u(C));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){
  var bt=document.getElementById("bt"),err=document.getElementById("err");
  bt.disabled=true;bt.textContent="Abrindo…";
  try{var h=await open_(pw);try{sessionStorage.setItem("metaads_pw",pw)}catch(e){}
    document.open();document.write(h);document.close();}
  catch(e){bt.disabled=false;bt.textContent="Abrir dashboard";
    if(!silent)err.textContent="Senha incorreta. Confira maiúsculas, números e o símbolo @.";}
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();go(document.getElementById("pw").value)});
try{var s=sessionStorage.getItem("metaads_pw");if(s)go(s,true)}catch(e){}
</script>
</body>
</html>
